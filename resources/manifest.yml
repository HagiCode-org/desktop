runtime:
  name: hagicode-desktop-runtime
  version: 0.2.8

paths:
  runtimeRoot: .
  runtimeHome: .
  runtimeDataRoot: ../runtime-data
  serverProgramRoot: ../apps/installed
  serverDataRoot: ../apps/data
  bin: bin
  config: config
  logs: logs
  data: data
  stateFile: state.json
  componentsRoot: components
  componentDataRoot: components
  defaultPm2Home: pm2
  npmPrefix: npm
  dotnetRuntime: components/dotnet/runtime
  vendoredRoot: components/bundled

vendoredRuntime:
  releaseVersion: &vendoredRuntimeVersion "2026.0526.0080"
  releaseTagUrl: &vendoredRuntimeReleaseTagUrl https://github.com/HagiCode-org/vendered/releases/tag/v2026.0526.0080
  releaseVersionByPlatform: &vendoredRuntimeReleaseVersionByPlatform
    linux-x64: *vendoredRuntimeVersion
    osx-x64: *vendoredRuntimeVersion
    osx-arm64: *vendoredRuntimeVersion
    win-x64: *vendoredRuntimeVersion
  releaseUrlsByPlatform: &vendoredRuntimeReleaseUrlsByPlatform
    linux-x64:
      - *vendoredRuntimeReleaseTagUrl
    osx-x64:
      - *vendoredRuntimeReleaseTagUrl
    osx-arm64:
      - *vendoredRuntimeReleaseTagUrl
    win-x64:
      - *vendoredRuntimeReleaseTagUrl

components:
  - name: dotnet/runtime/linux-x64
    type: runtime
    source: desktop-embedded-dotnet
    version: 10.0.10
    channelVersion: "10.0"
    lifecycleDependencies: []
    installScript: ../scripts/hagiscript/install-dotnet.mjs
    verifyScript: ../scripts/hagiscript/verify-dotnet.mjs

  - name: dotnet/runtime/osx-x64
    type: runtime
    source: desktop-embedded-dotnet
    version: 10.0.10
    channelVersion: "10.0"
    lifecycleDependencies: []
    installScript: ../scripts/hagiscript/install-dotnet.mjs
    verifyScript: ../scripts/hagiscript/verify-dotnet.mjs

  - name: dotnet/runtime/osx-arm64
    type: runtime
    source: desktop-embedded-dotnet
    version: 10.0.10
    channelVersion: "10.0"
    lifecycleDependencies: []
    installScript: ../scripts/hagiscript/install-dotnet.mjs
    verifyScript: ../scripts/hagiscript/verify-dotnet.mjs

  - name: dotnet/runtime/win-x64
    type: runtime
    source: desktop-embedded-dotnet
    version: 10.0.10
    channelVersion: "10.0"
    lifecycleDependencies: []
    installScript: ../scripts/hagiscript/install-dotnet.mjs
    verifyScript: ../scripts/hagiscript/verify-dotnet.mjs

phases:
  install:
    order:
      - dotnet/runtime/linux-x64
      - dotnet/runtime/osx-x64
      - dotnet/runtime/osx-arm64
      - dotnet/runtime/win-x64
  remove:
    order:
      - dotnet/runtime/win-x64
      - dotnet/runtime/osx-arm64
      - dotnet/runtime/osx-x64
      - dotnet/runtime/linux-x64
  update:
    order:
      - dotnet/runtime/linux-x64
      - dotnet/runtime/osx-x64
      - dotnet/runtime/osx-arm64
      - dotnet/runtime/win-x64

npmSync:
  packages:
    "@anthropic-ai/claude-code":
      version: 2.1.159
      target: 2.1.159
    "@github/copilot":
      version: 1.0.56
      target: 1.0.56
    "@google/gemini-cli":
      version: 0.44.1
      target: 0.44.1
    "@qoder-ai/qodercli":
      version: 1.0.10
      target: 1.0.10
    "@tencent-ai/codebuddy-code":
      version: 2.100.1
      target: 2.100.1
    "@fission-ai/openspec":
      version: 1.3.1
      target: 1.3.1
    "@openai/codex":
      version: 0.135.0
      target: 0.135.0
    "@earendil-works/pi-coding-agent":
      version: 0.78.1
      target: 0.78.1
      installArgs:
        - --ignore-scripts
    impeccable:
      version: 2.1.9
      target: 2.1.9
    opencode-ai:
      version: 1.15.13
      target: 1.15.13
    reasonix:
      version: 1.2.0
      target: 1.2.0
    skills:
      version: 1.5.1
      target: 1.5.1

desktopExtensions:
  distribution:
    programHomes:
      development: resources
      packaged: extra/runtime
    runtimeDataRelativePath: runtimeData

  embeddedRuntime:
    schemaVersion: 1
    channelVersion: "10.0"
    releaseVersion: 10.0.10
    releaseDate: "2026-07-14"
    source:
      provider: microsoft
      releaseMetadataUrl: https://dotnetcli.blob.core.windows.net/dotnet/release-metadata/10.0/releases.json
      allowedDownloadHosts:
        - builds.dotnet.microsoft.com
    platforms:
      linux-x64:
        rid: linux-x64
        archiveType: tar.gz
        downloadUrl: https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.10/aspnetcore-runtime-10.0.10-linux-x64.tar.gz
        aspNetCoreVersion: 10.0.10
        netCoreVersion: 10.0.10
        hostFxrVersion: 10.0.10
      osx-x64:
        rid: osx-x64
        archiveType: tar.gz
        downloadUrl: https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.10/aspnetcore-runtime-10.0.10-osx-x64.tar.gz
        aspNetCoreVersion: 10.0.10
        netCoreVersion: 10.0.10
        hostFxrVersion: 10.0.10
      osx-arm64:
        rid: osx-arm64
        archiveType: tar.gz
        downloadUrl: https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.10/aspnetcore-runtime-10.0.10-osx-arm64.tar.gz
        aspNetCoreVersion: 10.0.10
        netCoreVersion: 10.0.10
        hostFxrVersion: 10.0.10
      win-x64:
        rid: win-x64
        archiveType: zip
        downloadUrl: https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.10/aspnetcore-runtime-10.0.10-win-x64.zip
        aspNetCoreVersion: 10.0.10
        netCoreVersion: 10.0.10
        hostFxrVersion: 10.0.10
    expectedLayout:
      runtimeRootPattern: dotnet/<rid>
      requiredEntries:
        - dotnet[.exe]
        - host/fxr/<hostFxrVersion>
        - shared/Microsoft.NETCore.App/<netCoreVersion>
        - shared/Microsoft.AspNetCore.App/<aspNetCoreVersion>
        - .hagicode-runtime.json
