      npm: npm 스위치는 이후 Desktop이 관리하는 npm 설치 및 동기화 작업에만 영향을 줍니다. 저장하면 즉시 적용되며 관리형 서비스는 다시 시작되지 않습니다.
    actions:
      save: 변경 사항 저장
      saving: 저장 중...
      cancel: 취소
    messages:
      unchanged: 디버그 옵션이 이미 이 값을 사용하고 있습니다
      saveSuccess: 디버그 옵션이 저장되었습니다
