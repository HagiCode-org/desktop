        label: ~/.hagicode/runtime-data
        description: ランタイムデータを現在のユーザーのホームディレクトリ配下に保存します。固定の共有パスが必要な構成に最適です。
    warnings:
      noMigration: この設定を変更しても、対象パスが更新されるだけです。Desktop は既存のランタイムデータを自動的には移行しません。
      restart: 変更したプリセットを保存すると、管理対象のバックエンドが再起動され、新しいランタイムデータのルートがすぐに有効になります。
    actions:
      save: 変更を保存
      saving: 保存中...
      cancel: キャンセル
    messages:
      unchanged: ランタイムデータのパスはすでにこのプリセットを使用しています
      saveSuccess: ランタイムデータのパスを保存しました
      restartSuccess: ランタイムデータのパスを保存し、管理対象サービスを再起動しました
      saveFailed: ランタイムデータのパスを保存できませんでした
    errors:
      saveErrorDetail: '保存に失敗しました: {{error}}'
  debugOptions:
    title: デバッグオプション
    description: パッケージのインストール問題を診断するため、Desktop が管理する npm の動作を制御します。
    useIgnoreScriptsForManagedNpm:
      label: npm で `--ignore-scripts` を使用
      description: Desktop が管理する npm のインストールと同期でライフサイクルスクリプトをスキップし、postinstall などに起因する失敗を切り分けやすくします。
    skipPurchaseSimulateSuccess:
      label: 購入をスキップして成功をシミュレート
      shortLabel: チップの成功をシミュレート
      description: 有効にすると、チップの購入を開始しても Microsoft Store のチェックアウトをスキップし、選択したティアの購入が成功したものとして扱い、ランダムなお礼アニメーションも再生します。既定ではオフです。永続的な購入回数は書き込まれません。
    installDate:
      label: インストール日の生の値（msstoreRatingPrompt.installDate）
      description: ローカル設定に保存されているインストール日の文字列を、そのままの形で表示します。繰り返しクリックして編集すると、保存値を更新できます。
      placeholder: e.g. 2024-01-01T00:00:00.000Z
      ageDays: 'インストール経過日数: {{value}}'
      ageDaysUnknown: 不明
    notes:
      scope: この設定は、今後の Desktop 管理の npm のインストールと同期にのみ影響します。
      npm: npm のスイッチは、今後の Desktop 管理の npm のインストールと同期にのみ影響します。保存するとすぐに有効になり、管理対象サービスは再起動されません。
    actions:
      save: 変更を保存
      saving: 保存中...
      cancel: キャンセル
    messages:
      unchanged: デバッグオプションはすでにこれらの値になっています
      saveSuccess: デバッグオプションを保存しました
      saveFailed: デバッグオプションを保存できませんでした
    errors:
      saveErrorDetail: '保存に失敗しました: {{error}}'
