        description: この上部のセクションではサービスの健全性が要約されており、デスクトップ ダッシュボードのどこから始めればよいかを理解するのに役立ちます。
      updateReminder:
        title: 利用可能なアップデートを追跡する
        description: 互換性のある新しいパッケージが検出されると、このリマインダー カードにその状態が表示され、次のアクションへのリンクが表示されます。
      serviceCard:
        title: サービスステータスの監視
        description: ここで組み込みサービスの状態を確認し、ランタイムの準備ができたら開始、停止、再起動、または Hagicode を開きます。
      logAccess:
        title: ログフォルダへジャンプ
        description: これらのクイック アクションにより、デスクトップおよび Web アプリのログ フォルダーが開かれるため、診断中に証拠をより迅速に収集できます。
      activeVersion:
        title: アクティブなバージョンを確認する
        description: このセクションでは、現在インストールされているパッケージを示し、バージョン管理への簡単なルートを提供します。
      noVersionInstalled:
