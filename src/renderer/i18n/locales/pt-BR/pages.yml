turboEngine:
  eyebrow: Licença perpétua da Microsoft Store
  loadingTitle: Carregando o status do TurboEngine
  loading: Lendo o snapshot em cache do TurboEngine...
  verifyingTitle: Verificação de inicialização em andamento
  verifyingDescription: O Desktop verifica a Microsoft Store ao iniciar para evitar que os dados em cache do TurboEngine permaneçam como estado final.
  verifyingBadge: Verificando
  staleBadge: Snapshot em cache
  errorTitle: Snapshot do TurboEngine indisponível
