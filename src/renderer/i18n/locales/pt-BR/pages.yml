      saveSuccess: Configurações de atualização em segundo plano salvas
      saveFailed: Falha ao salvar as configurações de atualização em segundo plano
    errors:
      retainedArchiveCountPositive: A contagem de arquivos retidos deve ser um número inteiro positivo.
      saveErrorDetail: 'Falha ao salvar: {{error}}'
    notes:
      snapshotModel: O lembrete do painel é acionado por um instantâneo persistente do processo principal, de modo que o último estado de atualização conhecido sobrevive às recargas do Desktop.
      retentionPolicy: A limpeza de retenção remove apenas arquivos e metadados armazenados em cache. Os diretórios de versões instaladas permanecem intactos.
  runtimeDataPath:
    title: Caminho de armazenamento dos dados de runtime
    description: Escolha onde o Desktop armazena arquivos gerenciados pelo runtime, registros e outros dados de runtime.
    activePreset: 'Predefinição efetiva atual: {{preset}}'
    environmentOverrideBadge: Substituição por variável de ambiente ativa
    lockedByRuntime: Bloqueado pela Microsoft Store
    paths:
      configuredRoot: 'Raiz configurada: {{path}}'
      effectiveRoot: 'Raiz efetiva: {{path}}'
      environmentOverride: 'Raiz da substituição por variável de ambiente: {{path}}'
    options:
      userData-runtime-data:
        label: userData/runtime-data (padrão)
        description: Armazena os dados de runtime no diretório userData do Electron do Desktop. Ideal para a configuração padrão em uma única máquina.
      home-runtime-data:
        label: ~/.hagicode/runtime-data
        description: Armazena os dados de runtime no diretório pessoal do usuário atual. Ideal para implantações que precisam de um caminho compartilhado estável.
    warnings:
      noMigration: Alterar esta configuração apenas atualiza o caminho de destino. O Desktop não migra automaticamente os dados de runtime existentes.
      restart: Salvar uma predefinição alterada reinicia o backend gerenciado para que a nova raiz de dados de runtime entre em vigor imediatamente.
    actions:
      save: Salvar alterações
      saving: Salvando...
      cancel: Cancelar
    messages:
      unchanged: O caminho de dados de runtime já usa esta predefinição
      saveSuccess: Caminho de dados de runtime salvo
      restartSuccess: Caminho de dados de runtime salvo e serviços gerenciados reiniciados
      saveFailed: Falha ao salvar o caminho de dados de runtime
    errors:
      saveErrorDetail: 'Falha ao salvar: {{error}}'
  debugOptions:
    title: Opções de depuração
    description: Controle comportamentos do npm gerenciado pelo Desktop para diagnosticar problemas de instalação de pacotes.
    useIgnoreScriptsForManagedNpm:
      label: npm usa `--ignore-scripts`
      description: Faz as instalações e operações de sincronização do npm gerenciado pelo Desktop ignorarem os scripts de ciclo de vida, facilitando o isolamento de falhas relacionadas ao postinstall.
    skipPurchaseSimulateSuccess:
      label: Ignorar a compra e simular sucesso
      shortLabel: Simular sucesso da gorjeta
      description: Quando ativado, iniciar a compra de uma gorjeta ignora o checkout da Microsoft Store, trata o fluxo como compra bem-sucedida para o nível selecionado e ainda exibe uma animação de agradecimento aleatória. O padrão é desativado. Não grava contagens de compras persistentes.
    installDate:
      label: Data de instalação bruta (msstoreRatingPrompt.installDate)
      description: Mostra a string bruta exata da data de instalação persistida na configuração local. Clique repetidamente e edite para atualizar o valor salvo.
      placeholder: e.g. 2024-01-01T00:00:00.000Z
      ageDays: 'Tempo desde a instalação (dias): {{value}}'
      ageDaysUnknown: desconhecido
    notes:
      scope: Esta configuração afeta apenas futuras instalações e operações de sincronização do npm gerenciado pelo Desktop.
      npm: A opção do npm afeta apenas futuras instalações e operações de sincronização do npm gerenciado pelo Desktop. Ao salvá-la, ela entra em vigor imediatamente e não reinicia o serviço gerenciado.
    actions:
      save: Salvar alterações
      saving: Salvando...
      cancel: Cancelar
    messages:
      unchanged: As opções de depuração já usam estes valores
      saveSuccess: Opções de depuração salvas
      saveFailed: Falha ao salvar as opções de depuração
    errors:
      saveErrorDetail: 'Falha ao salvar: {{error}}'
