    managedInstall:
      title: As atualizações automáticas estão desativadas
      description: O aplicativo não se atualiza automaticamente. A forma como as atualizações são entregues depende do canal que você usou para instalá-lo, como a Microsoft Store ou o Steam.
    enabled:
      label: Ativar pré-downloads em segundo plano
      description: Quando uma versão mais recente compatível for encontrada, baixe o arquivo em segundo plano sem alterar o tempo de execução atual.
