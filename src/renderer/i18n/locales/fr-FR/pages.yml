turboEngine:
  eyebrow: Licence perpétuelle Microsoft Store
  loadingTitle: Chargement de l'état de TurboEngine
  loading: Lecture de l'instantané TurboEngine en cache...
  verifyingTitle: Vérification de démarrage en cours
  verifyingDescription: Desktop vérifie Microsoft Store au démarrage pour éviter que les données TurboEngine en cache restent l'état final.
  verifyingBadge: Vérification
  staleBadge: Instantané en cache
  errorTitle: Instantané TurboEngine indisponible
  errorDescription: 'Desktop n''a pas pu charger l''instantané TurboEngine : {{error}}'
  hero:
    title: Espace de travail TurboEngine
    activeDescription: TurboEngine is already licensed on this device. You can confirm the current Microsoft Store state, review diagnostics, and refresh whenever needed.
    inactiveDescription: TurboEngine uses a separate perpetual Microsoft Store license. This workspace lets you verify the current state, buy the license, and confirm the latest runtime diagnostics.
  article:
    unlockTitle: Un achat, déverrouillage permanent
    unlockLead: Le DLC TurboEngine regroupe la forte concurrence des propositions, la personnalisation de la marque, les thèmes étendus et le téléchargement d'avatars personnalisés dans un seul pack permanent. Après achat, aucun abonnement n'est requis et les fonctions s'appliquent directement à votre espace de travail actuel.
    featuresTitle: Principales fonctions débloquées
    purchaseNoticeTitle: Informations d'achat
    purchaseNoticeItems:
      channel: Les licences ne sont pas partagées entre les différents canaux de vente. Par exemple, une licence achetée sur Microsoft Store ne fonctionne qu'avec l'édition Microsoft Store.
      restart: Après l'achat, l'activation peut ne pas être immédiate. Essayez de redémarrer le service Hagicode et Desktop, puis redémarrez aussi l'ordinateur si nécessaire.
      online: Cette licence ne prend pas en charge l'utilisation hors ligne. Assurez-vous que l'ordinateur dispose d'une connexion réseau valide au démarrage de Desktop.
    features:
      proposalConcurrency:
        title: La limite de concurrence des propositions passe de 3 à 32
        description: Cela reste l'amélioration la plus importante et la plus sensible du DLC TurboEngine. Les propositions en génération, exécution et archivage partagent les mêmes emplacements de concurrence ; ce plafond plus élevé change donc directement la possibilité d'avancer sur plusieurs lignes de travail en parallèle.
      documentThemes:
        title: Thèmes de document étendus
        description: Dans les écrans de gestion des agents, vous pouvez passer d'un Document Theme étendu à l'autre et prévisualiser en temps réel le rendu de l'atelier, de l'historique et des regroupements de secours avec une autre terminologie et d'autres formulations.
      composeCommitCoAuthor:
        title: Co-Authored-By personnalisé pour AI Compose Commit
        description: Dans les paramètres Git, vous pouvez enregistrer un mode Co-Authored-By par défaut. Lors d'une exécution AI Compose, vous pouvez aussi passer temporairement à un collaborateur personnalisé avec nom et e-mail, ou ne pas ajouter ce suffixe pour cette fois.
      branding:
        title: Personnalisation de la marque
        description: Une fois le DLC TurboEngine actif, vous pouvez téléverser un logo d'en-tête et configurer le titre de l'application, le titre du navigateur et le lien de la marque. Il ne s'agit pas seulement de changer l'icône en haut à gauche, mais d'ouvrir toute la zone de marque de l'en-tête du workbench à la personnalisation.
      avatarUpload:
        title: Téléversement d'avatars personnalisés et réutilisation partagée
        description: Vous pouvez désormais téléverser un avatar personnalisé pour l'agent actuel, et la bibliothèque partagée d'avatars personnalisés peut aussi être réutilisée dans les flux de création, d'édition et de création en lot.
