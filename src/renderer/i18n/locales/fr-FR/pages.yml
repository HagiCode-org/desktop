      retainedArchiveCountPositive: Le nombre d’archives conservées doit être un entier positif.
      saveErrorDetail: 'Échec de l''enregistrement: {{error}}'
    notes:
      snapshotModel: Le rappel du tableau de bord est piloté par un instantané persistant du processus principal, de sorte que le dernier état de mise à jour connu survit aux rechargements du bureau.
      retentionPolicy: Le nettoyage de rétention supprime uniquement les archives et les métadonnées mises en cache. Les répertoires des versions installées restent intacts.
  runtimeDataPath:
    title: Chemin de stockage des données du runtime
    description: Choisissez où Desktop stocke les fichiers gérés par le runtime, les journaux et les autres données du runtime.
    activePreset: 'Préréglage effectif actuel : {{preset}}'
    environmentOverrideBadge: Remplacement par variable d’environnement actif
    lockedByRuntime: Verrouillé par Microsoft Store
    paths:
      configuredRoot: 'Racine configurée : {{path}}'
      effectiveRoot: 'Racine effective : {{path}}'
      environmentOverride: 'Racine de remplacement par variable d’environnement : {{path}}'
    options:
      userData-runtime-data:
        label: userData/runtime-data (par défaut)
        description: Stocke les données du runtime dans le répertoire userData d’Electron de Desktop. Idéal pour la configuration par défaut sur une seule machine.
      home-runtime-data:
        label: ~/.hagicode/runtime-data
        description: Stocke les données du runtime dans le répertoire personnel de l’utilisateur actuel. Idéal pour les déploiements nécessitant un chemin partagé stable.
    warnings:
      noMigration: Modifier ce paramètre met uniquement à jour le chemin cible. Desktop ne migre pas automatiquement les données du runtime existantes.
      restart: L’enregistrement d’un préréglage modifié redémarre le backend géré afin que la nouvelle racine des données du runtime prenne effet immédiatement.
    actions:
      save: Enregistrer les modifications
      saving: Enregistrement...
      cancel: Annuler
    messages:
      unchanged: Le chemin des données du runtime utilise déjà ce préréglage
      saveSuccess: Chemin des données du runtime enregistré
      restartSuccess: Chemin des données du runtime enregistré et services gérés redémarrés
      saveFailed: Échec de l’enregistrement du chemin des données du runtime
    errors:
      saveErrorDetail: 'Échec de l’enregistrement : {{error}}'
  debugOptions:
    title: Options de débogage
    description: Contrôlez les comportements npm gérés par Desktop pour diagnostiquer les problèmes d’installation de packages.
    useIgnoreScriptsForManagedNpm:
      label: npm utilise `--ignore-scripts`
      description: Fait ignorer les scripts de cycle de vie aux installations et synchronisations npm gérées par Desktop, afin d’isoler plus facilement les échecs liés à postinstall.
    skipPurchaseSimulateSuccess:
      label: Ignorer l’achat, simuler le succès
      shortLabel: Simuler le succès du pourboire
      description: Lorsque cette option est activée, le lancement d’un achat de pourboire ignore le paiement Microsoft Store, considère le parcours comme un achat réussi pour le palier sélectionné et joue tout de même une animation de remerciement aléatoire. Désactivée par défaut. N’enregistre pas de compteurs d’achats durables.
    installDate:
      label: Date d’installation brute (msstoreRatingPrompt.installDate)
      description: Affiche la chaîne exacte de la date d’installation brute persistée dans la configuration locale. Cliquez plusieurs fois, puis modifiez pour mettre à jour la valeur enregistrée.
      placeholder: e.g. 2024-01-01T00:00:00.000Z
      ageDays: 'Ancienneté de l’installation (jours) : {{value}}'
      ageDaysUnknown: inconnue
    notes:
      scope: Ce paramètre n’affecte que les futures installations et synchronisations npm gérées par Desktop.
      npm: Le commutateur npm n’affecte que les futures installations et synchronisations npm gérées par Desktop. L’enregistrement prend effet immédiatement et ne redémarre pas le service géré.
    actions:
      save: Enregistrer les modifications
      saving: Enregistrement...
      cancel: Annuler
    messages:
      unchanged: Les options de débogage utilisent déjà ces valeurs
      saveSuccess: Options de débogage enregistrées
      saveFailed: Échec de l’enregistrement des options de débogage
    errors:
      saveErrorDetail: 'Échec de l’enregistrement : {{error}}'
