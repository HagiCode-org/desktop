    title: Smart Config-Eingabeaufforderung
    description: Überprüfen Sie die gelöste Eingabeaufforderung, kopieren Sie sie in ein beliebiges unterstütztes AI CLI und schließen Sie den Konfigurationsablauf manuell ab.
  onboarding:
    title: Onboarding
    description: Führen Sie den Ersteinrichtungsassistenten erneut aus, um Pakete herunterzuladen, Abhängigkeiten zu installieren und den Dienst zu starten.
    restartWizard: Neustart-Assistent
    restartWizardDescription: Führen Sie den Ersteinrichtungsassistenten erneut aus, um Pakete herunterzuladen, Abhängigkeiten zu installieren und den Dienst zu starten.
    restartButton: Neustart-Assistent
    resetting: Zurücksetzen...
    resetSuccess: Der Assistent wurde zurückgesetzt
    resetError: 'Zurücksetzen fehlgeschlagen: {{error}}'
    homepageTour:
      title: Homepage-Tour zurücksetzen
      description: Löschen Sie den Abschlussstatus der Homepage-Tour, damit die geführte Komplettlösung beim nächsten Öffnen der Systemverwaltung erneut automatisch abgespielt werden kann.
      resetButton: Homepage-Tour zurücksetzen
      resetting: Tour wird zurückgesetzt...
      resetSuccess: Homepage-Tour wurde zurückgesetzt
      resetError: 'Homepage-Tour konnte nicht zurückgesetzt werden: {{error}}'
  updates:
    title: Hintergrundaktualisierungen
    description: Verwalten Sie automatische Prüfungen, Vorab-Downloads im Hintergrund und überprüfte Archivaufbewahrung.
    managedInstall:
      title: Automatische Updates sind deaktiviert
      description: Die Anwendung aktualisiert sich nicht automatisch. Wie Updates bereitgestellt werden, hängt vom Kanal ab, über den Sie sie installiert haben, etwa Microsoft Store oder Steam.
    enabled:
      label: Aktivieren Sie Hintergrund-Predownloads
      description: Wenn eine kompatible neuere Version gefunden wird, laden Sie das Archiv im Hintergrund herunter, ohne die aktuelle Laufzeit zu wechseln.
    retainedArchiveCount:
      label: Anzahl der beibehaltenen Archive
      description: Es werden nur verifizierte automatisch heruntergeladene Archive aufbewahrt. Bei Überschreitung des Limits werden ältere Einträge entfernt.
    actions:
      save: Einstellungen speichern
      saving: Sparen...
      cancel: Abbrechen
    messages:
      saveSuccess: Hintergrundaktualisierungseinstellungen gespeichert
      saveFailed: Die Einstellungen für die Hintergrundaktualisierung konnten nicht gespeichert werden
    errors:
      retainedArchiveCountPositive: Die Anzahl der beibehaltenen Archive muss eine positive Ganzzahl sein.
      saveErrorDetail: 'Speichern fehlgeschlagen: {{error}}'
    notes:
      snapshotModel: Die Dashboard-Erinnerung wird durch einen persistenten Hauptprozess-Snapshot gesteuert, sodass der letzte bekannte Aktualisierungsstatus auch nach dem Neuladen des Desktops erhalten bleibt.
      retentionPolicy: Bei der Aufbewahrungsbereinigung werden nur zwischengespeicherte Archive und Metadaten entfernt. Installierte Versionsverzeichnisse bleiben unberührt.
  runtimeDataPath:
    title: Speicherpfad für Laufzeitdaten
    description: Legen Sie fest, wo Desktop von der Laufzeit verwaltete Dateien, Protokolle und andere Laufzeitdaten speichert.
    activePreset: 'Aktuell wirksame Voreinstellung: {{preset}}'
    environmentOverrideBadge: Umgebungsüberschreibung aktiv
    lockedByRuntime: Durch Microsoft Store gesperrt
    paths:
      configuredRoot: 'Konfiguriertes Stammverzeichnis: {{path}}'
      effectiveRoot: 'Wirksames Stammverzeichnis: {{path}}'
      environmentOverride: 'Stammverzeichnis der Umgebungsüberschreibung: {{path}}'
    options:
      userData-runtime-data:
        label: userData/runtime-data (Standard)
        description: Speichert Laufzeitdaten im Electron-userData-Verzeichnis von Desktop. Am besten geeignet für die standardmäßige Einrichtung auf einem einzelnen Rechner.
      home-runtime-data:
        label: ~/.hagicode/runtime-data
        description: Speichert Laufzeitdaten im Home-Verzeichnis des aktuellen Benutzers. Am besten geeignet für Bereitstellungen, die einen stabilen gemeinsamen Pfad benötigen.
    warnings:
      noMigration: Eine Änderung dieser Einstellung aktualisiert nur den Zielpfad. Desktop migriert vorhandene Laufzeitdaten nicht automatisch.
      restart: Beim Speichern einer geänderten Voreinstellung wird das verwaltete Backend neu gestartet, damit das neue Stammverzeichnis für Laufzeitdaten sofort wirksam wird.
    actions:
      save: Änderungen speichern
      saving: Wird gespeichert...
      cancel: Abbrechen
    messages:
      unchanged: Der Pfad für Laufzeitdaten verwendet diese Voreinstellung bereits
      saveSuccess: Pfad für Laufzeitdaten gespeichert
      restartSuccess: Pfad für Laufzeitdaten gespeichert und verwaltete Dienste neu gestartet
      saveFailed: Der Pfad für Laufzeitdaten konnte nicht gespeichert werden
    errors:
      saveErrorDetail: 'Speichern fehlgeschlagen: {{error}}'
  debugOptions:
    title: Debug-Optionen
    description: Steuern Sie das Verhalten des von Desktop verwalteten npm, um Probleme bei der Paketinstallation zu diagnostizieren.
    useIgnoreScriptsForManagedNpm:
      label: npm verwendet `--ignore-scripts`
      description: Lässt von Desktop verwaltete npm-Installationen und Synchronisierungsvorgänge Lifecycle-Skripte überspringen, damit postinstall-bezogene Fehler leichter eingegrenzt werden können.
    skipPurchaseSimulateSuccess:
      label: Kauf überspringen, Erfolg simulieren
      shortLabel: Trinkgeld-Erfolg simulieren
      description: Wenn aktiviert, überspringt der Start eines Trinkgeld-Kaufs den Microsoft Store-Checkout, wertet den Vorgang für die gewählte Stufe als erfolgreichen Kauf und spielt weiterhin eine zufällige Dankesanimation ab. Standardmäßig deaktiviert. Schreibt keine dauerhaften Kaufzähler.
    installDate:
      label: Rohes Installationsdatum (msstoreRatingPrompt.installDate)
      description: Zeigt die exakt gespeicherte rohe Zeichenfolge des Installationsdatums aus der lokalen Konfiguration an. Mehrfach klicken und bearbeiten, um den gespeicherten Wert zu aktualisieren.
      placeholder: e.g. 2024-01-01T00:00:00.000Z
      ageDays: 'Installationsalter (Tage): {{value}}'
      ageDaysUnknown: unbekannt
    notes:
      scope: Diese Einstellung wirkt sich nur auf künftige von Desktop verwaltete npm-Installationen und Synchronisierungsvorgänge aus.
      npm: Der npm-Schalter wirkt sich nur auf künftige von Desktop verwaltete npm-Installationen und Synchronisierungsvorgänge aus. Er wird beim Speichern sofort wirksam und startet den verwalteten Dienst nicht neu.
    actions:
      save: Änderungen speichern
      saving: Wird gespeichert...
      cancel: Abbrechen
    messages:
      unchanged: Die Debug-Optionen verwenden diese Werte bereits
      saveSuccess: Debug-Optionen gespeichert
      saveFailed: Die Debug-Optionen konnten nicht gespeichert werden
    errors:
      saveErrorDetail: 'Speichern fehlgeschlagen: {{error}}'
