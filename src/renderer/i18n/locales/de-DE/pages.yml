    title: Designeinstellungen
    description: Hier ist ein eigener Bereich für künftige Steuerelemente zu hellem und dunklem Modus sowie visuellen Vorlieben reserviert.
  advancedSettings:
    title: Erweiterte Einstellungen
    description: Ein zentraler Ort für Protokolle, Experimente und erweiterte Laufzeitsteuerungen.
  placeholders:
    comingSoon: Dieses Einstellungsmodul ist im neuen Einstellungsframework registriert. Detaillierte Steuerelemente folgen mit einer späteren Änderung.
