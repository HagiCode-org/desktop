      resetSuccess: El recorrido por la página de inicio se ha restablecido
      resetError: 'No se pudo restablecer el recorrido por la página de inicio: {{error}}'
  updates:
    title: Actualizaciones de fondo
    description: Administre comprobaciones automáticas, descargas previas en segundo plano y retención de archivos verificados.
    managedInstall:
      title: Las actualizaciones automáticas están desactivadas
      description: La aplicación no se actualiza automáticamente. La forma de recibir las actualizaciones depende del canal con el que la instalaste, como Microsoft Store o Steam.
    enabled:
      label: Habilitar descargas previas en segundo plano
      description: Cuando encuentre una versión más nueva compatible, descargue el archivo en segundo plano sin cambiar el tiempo de ejecución actual.
    retainedArchiveCount:
      label: Recuento de archivos retenidos
      description: Sólo se conservan los archivos descargados automáticamente y verificados. Las entradas más antiguas se eliminan cuando se excede el límite.
    actions:
      save: Guardar configuración
      saving: Guardando...
      cancel: Cancelar
    messages:
      saveSuccess: Configuración de actualización en segundo plano guardada
      saveFailed: No se pudo guardar la configuración de actualización en segundo plano
    errors:
      retainedArchiveCountPositive: El recuento de archivos retenidos debe ser un número entero positivo.
      saveErrorDetail: 'Error al guardar: {{error}}'
    notes:
      snapshotModel: El recordatorio del panel está impulsado por una instantánea persistente del proceso principal, por lo que el último estado de actualización conocido sobrevive a las recargas del escritorio.
      retentionPolicy: La limpieza de retención solo elimina archivos y metadatos almacenados en caché. Los directorios de las versiones instaladas permanecen intactos.
  runtimeDataPath:
    title: Ruta de almacenamiento de datos del runtime
    description: Elige dónde guarda Desktop los archivos administrados por el runtime, los registros y otros datos del runtime.
    activePreset: 'Ajuste preestablecido vigente: {{preset}}'
    environmentOverrideBadge: Anulación por variable de entorno activa
    lockedByRuntime: Bloqueado por Microsoft Store
    paths:
      configuredRoot: 'Raíz configurada: {{path}}'
      effectiveRoot: 'Raíz efectiva: {{path}}'
      environmentOverride: 'Raíz de anulación por entorno: {{path}}'
    options:
      userData-runtime-data:
        label: userData/runtime-data (predeterminado)
        description: Guarda los datos del runtime en el directorio userData de Electron de Desktop. Lo mejor para la configuración predeterminada de un solo equipo.
      home-runtime-data:
        label: ~/.hagicode/runtime-data
        description: Guarda los datos del runtime en el directorio personal del usuario actual. Lo mejor para despliegues que necesitan una ruta compartida estable.
    warnings:
      noMigration: Cambiar este ajuste solo actualiza la ruta de destino. Desktop no migra automáticamente los datos del runtime existentes.
      restart: Al guardar un ajuste preestablecido modificado, se reinicia el backend administrado para que la nueva raíz de datos del runtime surta efecto de inmediato.
    actions:
      save: Guardar cambios
      saving: Guardando...
      cancel: Cancelar
    messages:
      unchanged: La ruta de datos del runtime ya usa este ajuste preestablecido
      saveSuccess: Ruta de datos del runtime guardada
      restartSuccess: Ruta de datos del runtime guardada y servicios administrados reiniciados
      saveFailed: No se pudo guardar la ruta de datos del runtime
    errors:
      saveErrorDetail: 'Error al guardar: {{error}}'
  debugOptions:
    title: Opciones de depuración
    description: Controla los comportamientos de npm administrados por Desktop para diagnosticar problemas de instalación de paquetes.
    useIgnoreScriptsForManagedNpm:
      label: npm usa `--ignore-scripts`
      description: Hace que las instalaciones y sincronizaciones de npm administradas por Desktop omitan los scripts de ciclo de vida, para aislar con más facilidad los fallos relacionados con postinstall.
    skipPurchaseSimulateSuccess:
      label: Omitir la compra y simular éxito
      shortLabel: Simular éxito de propina
      description: Si está activado, al iniciar la compra de una propina se omite el pago de Microsoft Store, se trata el flujo como una compra correcta para el nivel seleccionado y se sigue mostrando una animación de agradecimiento aleatoria. Desactivado por defecto. No guarda recuentos de compras persistentes.
    installDate:
      label: Fecha de instalación sin procesar (msstoreRatingPrompt.installDate)
      description: Muestra la cadena exacta de la fecha de instalación sin procesar guardada en la configuración local. Haz clic varias veces y edítala para actualizar el valor guardado.
      placeholder: e.g. 2024-01-01T00:00:00.000Z
      ageDays: 'Antigüedad de la instalación (días): {{value}}'
      ageDaysUnknown: desconocida
    notes:
      scope: Este ajuste solo afecta a las futuras instalaciones y sincronizaciones de npm administradas por Desktop.
      npm: El interruptor de npm solo afecta a las futuras instalaciones y sincronizaciones de npm administradas por Desktop. Al guardarlo, surte efecto de inmediato y no reinicia el servicio administrado.
    actions:
      save: Guardar cambios
      saving: Guardando...
      cancel: Cancelar
    messages:
      unchanged: Las opciones de depuración ya usan estos valores
      saveSuccess: Opciones de depuración guardadas
      saveFailed: No se pudieron guardar las opciones de depuración
    errors:
      saveErrorDetail: 'Error al guardar: {{error}}'
