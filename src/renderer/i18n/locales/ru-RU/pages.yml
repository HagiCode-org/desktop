      title: Сбросить тур по домашней странице
      description: Очистите состояние завершения обзора домашней страницы, чтобы пошаговое руководство могло автоматически воспроизводиться снова при следующем открытии «Управление системой».
      resetButton: Сбросить тур по домашней странице
      resetting: Сброс тура...
      resetSuccess: Тур по главной странице сброшен.
      resetError: 'Не удалось сбросить тур по главной странице: {{error}}'
  updates:
    title: Фоновые обновления
    description: Управляйте автоматическими проверками, фоновыми предварительными загрузками и хранением проверенных архивов.
    managedInstall:
      title: Автообновления отключены
      description: Приложение не обновляется автоматически. Способ получения обновлений зависит от канала, через который вы его установили, например Microsoft Store или Steam.
    enabled:
      label: Включить фоновую предварительную загрузку
      description: Когда будет найдена более новая совместимая версия, загрузите архив в фоновом режиме, не переключая текущую среду выполнения.
    retainedArchiveCount:
      label: Сохраненное количество архивов
      description: Сохраняются только проверенные автоматически загруженные архивы. Старые записи удаляются при превышении лимита.
    actions:
      save: Сохранить настройки
      saving: Сохранение...
      cancel: Отмена
    messages:
      saveSuccess: Настройки фонового обновления сохранены.
      saveFailed: Не удалось сохранить настройки фонового обновления.
    errors:
      retainedArchiveCountPositive: Счетчик сохраненных архивов должен быть положительным целым числом.
      saveErrorDetail: 'Не удалось сохранить: {{error}}'
    notes:
      snapshotModel: Напоминание на информационной панели создается на основе сохраняемого снимка основного процесса, поэтому последнее известное состояние обновления сохраняется при перезагрузке рабочего стола.
      retentionPolicy: При очистке хранилища удаляются только кэшированные архивы и метаданные. Каталоги установленных версий остаются нетронутыми.
  runtimeDataPath:
    title: Путь хранения данных среды выполнения
    description: Выберите, где Desktop хранит файлы среды выполнения, журналы и другие связанные данные.
    activePreset: 'Действующий пресет: {{preset}}'
    environmentOverrideBadge: Переопределено переменной окружения
    lockedByRuntime: Заблокировано Microsoft Store
    paths:
      configuredRoot: 'Настроенный корневой каталог: {{path}}'
      effectiveRoot: 'Действующий корневой каталог: {{path}}'
      environmentOverride: 'Корневой каталог из переменной окружения: {{path}}'
    options:
      userData-runtime-data:
        label: userData/runtime-data (по умолчанию)
        description: Хранит данные среды выполнения в каталоге userData Electron для Desktop. Лучше всего подходит для стандартной установки на одном компьютере.
      home-runtime-data:
        label: ~/.hagicode/runtime-data
        description: Хранит данные среды выполнения в домашнем каталоге текущего пользователя. Лучше всего подходит для развёртываний, которым нужен стабильный общий путь.
    warnings:
      noMigration: Изменение этого параметра обновляет только целевой путь. Desktop не переносит существующие данные среды выполнения автоматически.
      restart: Сохранение изменённого пресета перезапускает управляемый бэкенд, чтобы новый корневой каталог данных среды выполнения вступил в силу сразу.
    actions:
      save: Сохранить изменения
      saving: Сохранение...
      cancel: Отмена
    messages:
      unchanged: Путь данных среды выполнения уже использует этот пресет
      saveSuccess: Путь данных среды выполнения сохранён
      restartSuccess: Путь данных среды выполнения сохранён, управляемые службы перезапущены
      saveFailed: Не удалось сохранить путь данных среды выполнения
    errors:
      saveErrorDetail: 'Не удалось сохранить: {{error}}'
  debugOptions:
    title: Параметры отладки
    description: Управляйте поведением npm под управлением Desktop для диагностики проблем с установкой пакетов.
    useIgnoreScriptsForManagedNpm:
      label: npm использует `--ignore-scripts`
      description: Установки и операции синхронизации npm под управлением Desktop будут пропускать скрипты жизненного цикла, чтобы проще было локализовать сбои, связанные с postinstall.
    skipPurchaseSimulateSuccess:
      label: Пропустить покупку, имитировать успех
      shortLabel: Имитировать успех чаевых
      description: Когда включено, запуск покупки чаевых пропускает оформление в Microsoft Store, считает покупку успешной для выбранного уровня и по-прежнему показывает случайную анимацию благодарности. По умолчанию выключено. Постоянные счётчики покупок не записываются.
    installDate:
      label: Исходная дата установки (msstoreRatingPrompt.installDate)
      description: Показывает точную сохранённую исходную строку даты установки в локальной конфигурации. Щёлкайте повторно и редактируйте, чтобы обновить сохранённое значение.
      placeholder: e.g. 2024-01-01T00:00:00.000Z
      ageDays: 'Возраст установки (дни): {{value}}'
      ageDaysUnknown: неизвестно
    notes:
      scope: Этот параметр влияет только на будущие установки и операции синхронизации npm под управлением Desktop.
      npm: Переключатель npm влияет только на будущие установки и операции синхронизации npm под управлением Desktop. Сохранение вступает в силу сразу и не перезапускает управляемую службу.
    actions:
      save: Сохранить изменения
      saving: Сохранение...
      cancel: Отмена
    messages:
      unchanged: Параметры отладки уже используют эти значения
      saveSuccess: Параметры отладки сохранены
      saveFailed: Не удалось сохранить параметры отладки
    errors:
      saveErrorDetail: 'Не удалось сохранить: {{error}}'
