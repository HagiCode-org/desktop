name: Desktop Non-Interactive Integration

on:
  workflow_run:
    workflows:
      - Build Hagicode Desktop
    types:
      - completed

permissions:
  actions: read
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  integration-linux:
    name: Non-Interactive Integration (Linux)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build main-process helpers
        run: npm run build:tsc

      - name: Download Linux AppImage artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/download-workflow-artifact.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "${{ github.event.workflow_run.id }}" \
            --artifact-name "release-linux-appimage-assets,hagicode-linux-appimage-${{ github.event.workflow_run.head_sha }}" \
            --output-dir pkg

      - name: Verify packaged runtime and backend lifecycle when bundled
        run: npm run package:non-interactive-integration

  integration-macos:
    name: Non-Interactive Integration (macOS)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-latest
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build main-process helpers
        run: npm run build:tsc

      - name: Download macOS DMG artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/download-workflow-artifact.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "${{ github.event.workflow_run.id }}" \
            --artifact-name "release-macos-x64-dmg-assets,hagicode-macos-x64-dmg-${{ github.event.workflow_run.head_sha }}" \
            --output-dir pkg
          node scripts/download-workflow-artifact.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "${{ github.event.workflow_run.id }}" \
            --artifact-name "release-macos-arm64-dmg-assets,hagicode-macos-arm64-dmg-${{ github.event.workflow_run.head_sha }}" \
            --output-dir pkg

      - name: Verify packaged runtime and backend lifecycle when bundled
        run: npm run package:non-interactive-integration

  integration-windows:
    name: Non-Interactive Integration (Windows)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build main-process helpers
        run: npm run build:tsc

      - name: Download Windows portable artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/download-workflow-artifact.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "${{ github.event.workflow_run.id }}" \
            --artifact-name "release-windows-portable-assets,hagicode-windows-portable-${{ github.event.workflow_run.head_sha }}" \
            --output-dir pkg

      - name: Verify packaged runtime and backend lifecycle when bundled
        shell: bash
        run: npm run package:non-interactive-integration
