name: Release Drafter

# Drafts the next stable release from Conventional Commit messages since the last
# vX.Y.Z tag, so direct pushes to main are covered as well as merged pull requests.
# Publishing the draft is a manual step; this workflow never publishes a release.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Optional X.Y.Z to use instead of the version derived from the commits
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  update_release_draft:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate version and notes from commits
        id: notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          echo "version=$(node .github/scripts/release-notes.mjs version)" >> "$GITHUB_OUTPUT"
          node .github/scripts/release-notes.mjs notes > "$RUNNER_TEMP/release-notes.md"
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.notes.outputs.version }}
          TITLE_TEMPLATE: 'v{version} 🌈'
        run: |
          tag="v$VERSION"
          title="${TITLE_TEMPLATE//\{version\}/$VERSION}"
          target="$(git rev-parse HEAD)"
          existing="$(gh release list --limit 100 --json tagName,isDraft --jq '[.[] | select(.isDraft)][0].tagName // empty')"
          if [ -n "$existing" ]; then
            gh release edit "$existing" --tag "$tag" --title "$title" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --target "$target"
          else
            gh release create "$tag" --draft --title "$title" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --target "$target"
          fi
          echo "Draft release $tag updated from commits up to $target." >> "$GITHUB_STEP_SUMMARY"
