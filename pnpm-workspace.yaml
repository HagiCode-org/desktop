# pnpm settings (pnpm 12 reads these here, not from package.json).
# Replaces the npm `overrides` field.
overrides:
  "@electron/node-gyp": 10.2.0-electron.1

# Layout workaround (tool requirement): Electron Forge refuses to package under pnpm unless
# `node-linker` is `hoisted` ("When using pnpm, node-linker must be set to hoisted"), and its
# asar/prune packaging walks a flat node_modules. Scoped to this repository only.
nodeLinker: hoisted

# Dependency lifecycle scripts run only for approved packages. Reviewed from the old lockfile's
# `hasInstallScript` entries:
#   core-js     - postinstall only prints a donation banner; denied.
#   fs-xattr    - macOS-only optional native addon used by the DMG maker; needs its build step on macOS.
#   macos-alias - macOS-only optional native addon used by the DMG maker; needs its build step on macOS.
#   fsevents    - macOS-only optional file watcher; ships a prebuilt binary, no script needed.
# electron has no install script in this lockfile (the binary is fetched on first run), so it is not listed.
allowBuilds:
  core-js: false
  fs-xattr: true
  macos-alias: true
  fsevents: false

# pnpm 12 rejects packages younger than its default minimumReleaseAge (1 day). First-party packages
# are published and consumed the same day, so exempt only that scope.
minimumReleaseAgeExclude:
  - "@hagicode/*"

# Agent skills shipped inside dependencies are not installed into the repository (reviewed: denied).
permissions:
  '@hagicode/hagi18n':
    skills: false
